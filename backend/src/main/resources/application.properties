# AR Industries Backend - Application Properties
spring.application.name=ar-industries-backend

# Server (Supports Render dynamic PORT environment variable)
server.port=
server.servlet.context-path=/

# Database (Overridable via DB_URL or SPRING_DATASOURCE_URL in cloud environments)
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.open-in-view=false

# Flyway Database Migrations (Auto-initializes all tables and seed data in Cloud MySQL)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# JWT Security
jwt.secret=
jwt.expiration-ms=

# Actuator & Health Probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# Logging
logging.level.com.arindustries=INFO
logging.level.org.springframework.security=WARN
